# Render Blueprint — with a PERSISTENT DISK for the SQLite database.
# WARNING: Render persistent disks are only available on PAID instance types (and are billed per GB).
# Applying this Blueprint will create a paid service. Do not apply it unless you've chosen to pay.
# To use it: Render Dashboard → New → Blueprint → set "Blueprint path" to render.disk.yaml.
services:
  - type: web
    name: subscription-watchdog
    runtime: python
    plan: 0.5c-512mb   # smallest paid web plan; the free plan cannot attach disks
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_PATH
        value: /var/data/watchdog.db
      - key: RETENTION_DAYS
        value: 7
      - key: SECURE_COOKIES
        value: 1
    disk:
      name: watchdog-data
      mountPath: /var/data
      sizeGB: 1

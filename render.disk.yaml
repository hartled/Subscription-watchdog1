# Render Blueprint — with a PERSISTENT DISK for the SQLite database.
# WARNING: Render persistent disks are only available on PAID compute plans and cost $0.25/GB/month.
# This file = $7/mo web (0.5c-512mb) + 1 GB disk ($0.25/mo) ≈ $7.25/mo + any workspace plan fee. See docs/storage-plan.md.
# Applying this Blueprint will create a paid service. Do not apply it unless you've chosen to pay.
# To use it: Render Dashboard → New → Blueprint → set "Blueprint path" to render.disk.yaml.
services:
  - type: web
    name: subscription-watchdog
    runtime: python
    plan: 0.5c-512mb   # 'Starter': 0.5 CPU / 512 MB, $7/mo (verified render.com/pricing 2026-10-26); free can't attach disks
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_PATH
        value: /var/data/watchdog.db
      - key: RETENTION_DAYS
        value: 7
      - key: SECURE_COOKIES
        value: 1
      - key: PERSISTENT_STORAGE       # disk survives restarts: saved history is offered
        value: 1
      # --- One-time Unlock (Stripe Checkout). Leave the sync:false secrets empty and the unlock shows "coming soon". ---
      - key: STRIPE_SECRET_KEY        # sk_test_… while testing, sk_live_… to take real payments
        sync: false
      - key: STRIPE_WEBHOOK_SECRET    # whsec_… from the Stripe webhook endpoint for <APP_BASE_URL>/stripe/webhook
        sync: false
      - key: UNLOCK_SECRET            # signs unlock codes; Render generates it once — never change it or codes break
        generateValue: true
      - key: APP_BASE_URL             # e.g. https://subscription-watchdog.onrender.com (no trailing slash)
        sync: false
      - key: STRIPE_PRICE_ID          # optional price_…; if empty an inline $7.00 price is used
        sync: false
      - key: UNLOCK_PRICE_CENTS       # display price + inline price; keep in sync with STRIPE_PRICE_ID
        value: 700
      - key: SUPPORT_EMAIL            # refund/support contact shown on pricing, privacy & error pages; REQUIRED before live keys are accepted
        value: subscriptionwatchdog@mail.grokbot.com
      # --- Optional email recovery for Unlock holders. OFF unless EMAIL_PROVIDER is set to smtp|resend|postmark. ---
      - key: EMAIL_PROVIDER           # none (default: email recovery hidden/"not available yet") | smtp | resend | postmark
        value: none
      - key: EMAIL_FROM               # e.g. "Subscription Watchdog <recovery@yourdomain.com>" (must be a sender your provider allows)
        sync: false
      - key: SMTP_HOST                # smtp only
        sync: false
      - key: SMTP_PORT                # smtp only; 587 (starttls) or 465 (ssl)
        value: 587
      - key: SMTP_SECURITY            # starttls | ssl | none
        value: starttls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD            # secret
        sync: false
      - key: RESEND_API_KEY           # resend only (secret)
        sync: false
      - key: POSTMARK_TOKEN           # postmark only (secret)
        sync: false
    disk:
      name: watchdog-data
      mountPath: /var/data
      sizeGB: 1

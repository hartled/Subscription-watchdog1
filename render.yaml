# Render Blueprint — FREE tier (no persistent disk).
# On the free plan the filesystem is ephemeral: the SQLite file is wiped on every redeploy/restart and
# the instance spins down when idle. For a session-scoped, auto-deleting app that's acceptable for an MVP.
# Need data to survive deploys? Use render.disk.yaml instead (requires a PAID plan — see README).
services:
  - type: web
    name: subscription-watchdog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_DIR
        value: /tmp/watchdog-data
      - key: RETENTION_DAYS
        value: 7
      - key: SECURE_COOKIES
        value: 1
      - key: PERSISTENT_STORAGE       # 0 = disk wiped on restart: saved history is not offered/sold
        value: 0
      # --- One-time Unlock (Stripe Checkout). Leave the sync:false secrets empty and the unlock shows "coming soon". ---
      - key: STRIPE_SECRET_KEY        # sk_test_… while testing, sk_live_… to take real payments
        sync: false
      - key: STRIPE_WEBHOOK_SECRET    # whsec_… from the Stripe webhook endpoint for <APP_BASE_URL>/stripe/webhook
        sync: false
      - key: UNLOCK_SECRET            # signs unlock codes; Render generates it once — never change it or codes break
        generateValue: true
      - key: APP_BASE_URL             # e.g. https://subscription-watchdog.onrender.com (no trailing slash)
        sync: false
      - key: STRIPE_PRICE_ID          # optional price_…; if empty an inline $7.00 price is used
        sync: false
      - key: UNLOCK_PRICE_CENTS       # display price + inline price; keep in sync with STRIPE_PRICE_ID
        value: 700
      - key: SUPPORT_EMAIL            # refund requests go here; REQUIRED before live keys are accepted
        sync: false
